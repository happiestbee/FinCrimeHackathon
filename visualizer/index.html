    if (runToken !== state.swarmToken) { card.remove(); cursor.remove(); return; }

    caret.style.opacity = "0";
    cursor.classList.remove("visible");

    if (trace.matched && trace.highlight_quote) {
      selLayer.classList.add("faded");
      applyHighlightSpan(paraEl, trace.text || "", trace.highlight_quote);
      card.classList.add("has-hit");
      outcomeEl.className = "swarm-outcome hit";
      outcomeEl.textContent = `✓ ${trace.badge || "EXTRACTED"}`;
      await sleepMs(960);
    } else {
      selLayer.classList.add("faded");
      outcomeEl.className = "swarm-outcome empty";
      outcomeEl.textContent = "· Scanned — No entity signal";
      await sleepMs(540);
    }
    if (runToken !== state.swarmToken) { card.remove(); cursor.remove(); return; }

    cursor.remove();

    // Gravitational curved suction into the central Quantum Vortex
    const cardCx0 = slot.left + cardW / 2;
    const cardCy0 = slot.top + cardH / 2;
    const vx = stageW / 2;
    const vy = stageH / 2;
    const dx = vx - cardCx0;
    const dy = vy - cardCy0;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = (-dy / dist) * slot.swirlSign;
    const ny = (dx / dist) * slot.swirlSign;

    card.classList.add("sucking");
    const suckMs = 850;
    await new Promise(resolve => {
      const startTs = performance.now();
      function suckStep(now) {
        if (runToken !== state.swarmToken) { resolve(); return; }
        const t = Math.min(1, (now - startTs) / suckMs);
        const p = Math.pow(t, 2.15);
        const swirl = Math.sin(Math.PI * t) * 44;
        const tx = dx * p + nx * swirl;
        const ty = dy * p + ny * swirl;
        const sc = Math.max(0.05, 1 - 0.94 * p);
        const rot = slot.swirlSign * 22 * p;
        const op = t < 0.65 ? 1 - 0.15 * t : Math.max(0, 1 - (t - 0.65) / 0.35);
        const blurPx = (p * 3.2).toFixed(2);
        card.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
        card.style.opacity = op.toFixed(3);
        card.style.filter = `blur(${blurPx}px)`;
        if (t < 1) requestAnimationFrame(suckStep);
        else resolve();
      }
      requestAnimationFrame(suckStep);
    });

    card.remove();
    if (runToken !== state.swarmToken) return;
    statsRef.absorbed += 1;
    pulseVortex(Boolean(trace.matched), statsRef.absorbed, statsRef.total);
  }

  async function runSwarmSequence(datasetId, summaryPromise, forceReplay = false) {
    const runToken = ++state.swarmToken;
    const dsMeta = state.datasets.find(d => d.id === datasetId);
    const dsLabel = dsMeta ? dsMeta.name : datasetId;

    if (els.topbar) {
      els.swarmStage.style.top = `${els.topbar.offsetHeight || 48}px`;
    }
    els.swarmCardsLayer.innerHTML = "";
    els.swarmCursorsLayer.innerHTML = "";
    els.swarmVortex.classList.remove("collapsing", "absorb-cobalt", "absorb-hit");
    els.swarmHudTitle.textContent = `SWARM READER · ${dsLabel.toUpperCase()}`;
    els.vortexCount.textContent = "0 / 6";
    els.swarmStage.classList.remove("closing");
    els.swarmStage.classList.add("active");
    els.swarmStage.setAttribute("aria-hidden", "false");

    const statsRef = { absorbed: 0, total: 6 };
    const shownKeys = new Set();
    let activePromises = [];
    let nextSlot = 0;

    let summaryData = null;
    let summaryDone = false;
    summaryPromise.then(data => {
      summaryData = data;
      summaryDone = true;
    }).catch(() => { summaryDone = true; });

    // If cold uncached load on live server, stream genuine reading events live
    if (!state.staticMode && !forceReplay && !(dsMeta && dsMeta.loaded)) {
      let pollTick = 0;
      while (!summaryDone && runToken === state.swarmToken) {
        try {
          const pr = await fetch(`/api/datasets/${encodeURIComponent(datasetId)}/progress`);
          if (pr.ok && runToken === state.swarmToken) {
            const pdata = await pr.json();
            const tot = pdata.total || (dsMeta && dsMeta.hit_count_hint) || 0;
            const llmC = pdata.llm_calls || 0;
            els.swarmHudTitle.textContent = `SWARM STREAM · ${pdata.processed}/${tot} HITS · ${llmC} GROK CALLS`;
            const evts = pdata.events || [];
            for (const evt of evts) {
              if (shownKeys.size >= 6) break;
              const k = `${evt.source_mode}|${(evt.text || "").slice(0, 60)}`;
              if (!shownKeys.has(k)) {
                shownKeys.add(k);
                const slot = nextSlot++;
                const p = sleepMs((slot % 3) * 220).then(() => animateSingleSwarmCard(evt, slot, runToken, statsRef));
                activePromises.push(p);
              }
            }
          }
        } catch (_) {}
        if (summaryDone || runToken !== state.swarmToken) break;
        pollTick += 1;
        await sleepMs(Math.min(350, 220 + pollTick * 20));
      }
    } else {
      await summaryPromise;
    }

    if (runToken !== state.swarmToken) return;

    const traces = (summaryData && summaryData.swarm_traces) ? summaryData.swarm_traces : [];
    const remaining = traces.filter(t => !shownKeys.has(`${t.source_mode}|${(t.text || "").slice(0, 60)}`));

    if (shownKeys.size === 0 && traces.length > 0) {
      statsRef.total = traces.length;
      els.vortexCount.textContent = `0 / ${statsRef.total}`;
      const llmCount = (summaryData.llm_info && summaryData.llm_info.stats && summaryData.llm_info.stats.requests_total) || 0;
      const modeTag = llmCount > 0 ? `${llmCount} GROK LLM CALLS` : "DETERMINISTIC SCAN";
      els.swarmHudTitle.textContent = `SWARM READER · ${dsLabel.toUpperCase()} · ${modeTag}`;

      const isNarrow = window.innerWidth < 740;
      if (isNarrow) {
        // On narrow phones show 2 cards per wave (top + bottom of Vortex) so cards never overlap
        const pairs = [traces.slice(0, 2), traces.slice(2, 4), traces.slice(4, 6)].filter(g => g.length);
        let pairPromises = [];
        pairs.forEach((grp, pIdx) => {
          grp.forEach((tr, cIdx) => {
            pairPromises.push(
              sleepMs(pIdx * 3600 + cIdx * 320).then(() => animateSingleSwarmCard(tr, cIdx, runToken, statsRef))
            );
          });
        });
        await Promise.all(pairPromises);
      } else {
        const wave1 = traces.slice(0, 3);
        const wave2 = traces.slice(3, 6);
        const w1Promises = wave1.map((tr, idx) =>
          sleepMs(idx * 340).then(() => animateSingleSwarmCard(tr, idx, runToken, statsRef))
        );
        let w2Promises = [];
        if (wave2.length > 0) {
          w2Promises = wave2.map((tr, idx) =>
            sleepMs(3150 + idx * 340).then(() => animateSingleSwarmCard(tr, idx + 3, runToken, statsRef))
          );
        }
        await Promise.all([...w1Promises, ...w2Promises]);
      }
    } else {
      const tail = remaining.slice(0, Math.max(0, 6 - shownKeys.size));
      if (tail.length > 0) {
        statsRef.total = shownKeys.size + tail.length;
        els.vortexCount.textContent = `${statsRef.absorbed} / ${statsRef.total}`;
        tail.forEach((tr, idx) => {
          const slot = nextSlot++;
          activePromises.push(
            sleepMs(idx * 260).then(() => animateSingleSwarmCard(tr, slot, runToken, statsRef))
          );
        });
      } else {
        statsRef.total = Math.max(1, shownKeys.size);
        els.vortexCount.textContent = `${statsRef.absorbed} / ${statsRef.total}`;
      }
      await Promise.all(activePromises);
    }

    if (runToken !== state.swarmToken) return;
    els.swarmVortex.classList.add("collapsing");
    await sleepMs(260);
    if (runToken === state.swarmToken) closeSwarmStage(false, false);
  }

  async function init() {
    initFlockCursors();
    try {
      let data = null;
      const apiResp = await fetch("/api/datasets").catch(() => null);
      if (apiResp && apiResp.ok && (apiResp.headers.get("content-type") || "").includes("json")) {
        data = await apiResp.json();
        state.staticMode = false;
      } else {
        const stResp = await fetch("./static_data/datasets.json");
        if (!stResp.ok) throw new Error(`HTTP ${stResp.status}`);
        data = await stResp.json();
        state.staticMode = true;
      }
      state.datasets = data.datasets || [];
      els.datasetSelect.innerHTML = state.datasets
        .map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("");

      const params = new URLSearchParams(window.location.search);
      const reqDs = params.get("dataset");
      const reqHit = params.get("hit");
      const firstId = state.datasets.some(d => d.id === reqDs) ? reqDs : (state.datasets[0] && state.datasets[0].id);
      if (firstId) {
        els.datasetSelect.value = firstId;
        await loadDataset(firstId, reqHit);
      }
    } catch (err) {
      closeSwarmStage(true, true);
      els.canvas.innerHTML = `<div class="loading-state" style="color:#fb7185;">Connection error: ${esc(err.message)}</div>`;
    }
  }

  async function loadDataset(datasetId, preferHitId = null) {
    state.currentDataset = datasetId;
    state.selectedCandidateIdx = 0;
    state.studioBuildToken += 1;
    state.pendingStudioBuild = true;
    closeSheet();
    els.railList.innerHTML = `<div class="loading-state"><span class="pulse-ring"></span> Resolving…</div>`;
    els.canvas.innerHTML = `<div class="loading-state"><span class="pulse-ring"></span> Resolving "${esc(datasetId)}" dataset…</div>`;

    const summaryUrl = state.staticMode
      ? `./static_data/${encodeURIComponent(datasetId)}/summary.json`
      : `/api/datasets/${encodeURIComponent(datasetId)}/summary`;
    const summaryPromise = fetch(summaryUrl).then(r => r.json());
    const swarmAnim = runSwarmSequence(datasetId, summaryPromise, false);

    const data = await summaryPromise;
    if (state.currentDataset !== datasetId) return;
    state.summary = data;
    const meta = state.datasets.find(d => d.id === datasetId);
    if (meta) meta.loaded = true;

    state.filters = { decision: "ALL", reasonCode: "ALL", resStatus: "ALL", labeledOnly: false, search: "" };
    els.searchInput.value = "";
    els.resStatusFilter.value = "ALL";
    els.labeledOnlyChk.checked = false;

    const rcs = Object.entries(state.summary.reason_counts || {});
    els.reasonFilter.innerHTML = `<option value="ALL">All reason codes</option>` +
      rcs.map(([c, n]) => `<option value="${esc(c)}">${esc(c)} (${n})</option>`).join("");

    renderTopTelemetry();
    const hitTask = applyFilters(preferHitId);
    await swarmAnim;
    await hitTask;
    if (state.currentDataset === datasetId && state.pendingStudioBuild && state.lastRenderedDetail) {
      await sleepMs(140);
      if (state.currentDataset === datasetId && state.pendingStudioBuild) {
        await runStudioCursorBuild(state.lastRenderedDetail);
      }
    }
  }

  function renderTopTelemetry() {
    const sum = state.summary;
    const total = (sum.totals && sum.totals.hits) || 0;
    const dc = sum.decision_counts || {};
    const diff = dc.DIFFERENT_ENTITY || 0;
    const same = dc.SAME_ENTITY || 0;
    const rev = dc.REVIEW || 0;
    const pct = n => total ? ((100 * n) / total).toFixed(1) + "%" : "0%";

    els.specDiff.style.width = pct(diff);
    els.specSame.style.width = pct(same);
    els.specRev.style.width = pct(rev);

    const items = [
      { id: "ALL", cls: "", dot: "cobalt", lbl: "ALL", val: total },
      { id: "DIFFERENT_ENTITY", cls: "diff", dot: "diff", lbl: "CLEARED", val: diff },
      { id: "SAME_ENTITY", cls: "same", dot: "same", lbl: "MATCHED", val: same },
      { id: "REVIEW", cls: "rev", dot: "rev", lbl: "REVIEW", val: rev },
    ];
    els.telemetryStrip.innerHTML = items.map(it => `
      <button class="t-metric ${it.cls} ${state.filters.decision === it.id ? "active" : ""}" data-dec="${it.id}">
        <span class="dot ${it.dot}"></span>
        <span>${it.lbl}</span>
        <strong>${it.val}</strong>
      </button>
    `).join("");

    els.telemetryStrip.querySelectorAll(".t-metric").forEach(btn => {
      btn.addEventListener("click", () => {
        const d = btn.getAttribute("data-dec");
        state.filters.decision = (state.filters.decision === d && d !== "ALL") ? "ALL" : d;
        renderTopTelemetry();
        applyFilters();
      });
    });

    const st = sum.label_stats;
    const llm = sum.llm_info || {};
    const llmTag = llm.enabled
      ? `<span class="llm-tag" style="color:var(--cobalt-bright);" title="${esc(llm.backend)} · ${esc(llm.model)} · LLM calls: ${(llm.stats && llm.stats.requests_total) || 0}">${esc(llm.backend)} · ${esc(llm.model)}</span>`
      : `<span class="llm-tag" style="color:var(--ink-3);">OFFLINE</span>`;
    if (st) {
      els.scoreReadout.innerHTML = `
        ${llmTag}
        <span style="color:var(--ink-4);">·</span>
        <span>SCORE <span class="ok">${st.decision_score.toFixed(1)}</span></span>
        <span style="color:var(--ink-4);">·</span>
        <span>${st.right_decisions}/${st.total}</span>
        <span style="color:var(--ink-4);">·</span>
        <span>UNSAFE <span class="ok">${st.unsafe_clearances}</span></span>
      `;
    } else {
      els.scoreReadout.innerHTML = `${llmTag} <span style="color:var(--ink-4);">·</span> <span>${sum.load_time_ms}ms</span>`;
    }
  }

  function applyFilters(preferHitId = null) {
    if (!state.summary) return;
    const f = state.filters;
    const q = f.search.trim().toLowerCase();
    const list = state.summary.hits.filter(h => {
      if (f.decision !== "ALL" && h.decision !== f.decision) return false;
      if (f.reasonCode !== "ALL" && h.reason_code !== f.reasonCode) return false;
      if (f.resStatus !== "ALL" && h.resolution_status !== f.resStatus) return false;
      if (f.labeledOnly && !h.has_label) return false;
      if (q) {
        const hay = [h.hit_id, h.alert_id, h.customer_record_id || "null", h.customer_name, h.hit_name, h.reason_code, h.reason].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    state.filteredHits = list;
    const dirty = f.decision !== "ALL" || f.reasonCode !== "ALL" || f.resStatus !== "ALL" || f.labeledOnly || q.length > 0;
    els.resetBtn.style.display = dirty ? "inline" : "none";
    els.railCount.textContent = `${list.length} / ${state.summary.hits.length} HITS · J/K`;

    renderRail();

    if (preferHitId && list.some(h => h.hit_id === preferHitId)) return selectHit(preferHitId);
    else if (list.some(h => h.hit_id === state.selectedHitId)) return selectHit(state.selectedHitId, false);
    else if (list.length > 0) return selectHit(list[0].hit_id);
    else {
      state.selectedHitId = null;
      els.canvas.innerHTML = `<div class="loading-state">No hits match active filters.</div>`;
    }
    return Promise.resolve();
  }

  function renderRail() {
    if (!state.filteredHits.length) {
      els.railList.classList.remove("building-blank");
      els.railList.innerHTML = `<div class="loading-state" style="padding:24px;">Empty queue</div>`;
      return;
    }
    els.railList.classList.toggle("building-blank", Boolean(state.pendingStudioBuild));
    els.railList.innerHTML = state.filteredHits.map(h => {
      const cls = decCls(h.decision);
      const act = h.hit_id === state.selectedHitId ? "active" : "";
      const tick = h.label_match === "MATCH" ? `<span style="color:#34d399;font-size:10px;">✓</span>` : "";
      return `
        <div class="rail-row ${act}" data-hid="${esc(h.hit_id)}">
          <div class="rr-top">
            <span class="dot ${cls}"></span>
            <span class="rr-id">${esc(h.hit_id)}</span>
            ${tick}
            <span class="rr-type">${esc(h.entity_type === "Company" ? "CO" : "IND")}</span>
          </div>
          <div class="rr-names">${esc(h.customer_name)} <span style="color:var(--ink-4);">${decOp(h.decision)}</span> ${esc(h.hit_name)}</div>
          <div class="rr-sub">
            <span>${esc(h.reason_code)}</span>
            <span>${esc(h.customer_record_id === null ? "null" : h.customer_record_id)}</span>
          </div>
        </div>
      `;
    }).join("");

    els.railList.querySelectorAll(".rail-row").forEach(row => {
      row.addEventListener("click", () => selectHit(row.getAttribute("data-hid")));
    });
  }

  async function selectHit(hitId, showLoader = true) {
    state.selectedHitId = hitId;
    state.selectedCandidateIdx = 0;
    if (!els.swarmStage.classList.contains("active")) {
      state.studioBuildToken += 1;
      flockState.building = false;
      updateFlockVisibility();
    }

    els.railList.querySelectorAll(".rail-row").forEach(r => {
      r.classList.toggle("active", r.getAttribute("data-hid") === hitId);
    });
    const activeRow = els.railList.querySelector(".rail-row.active");
    if (activeRow) activeRow.scrollIntoView({ block: "nearest" });

    const url = new URL(window.location.href);
    url.searchParams.set("dataset", state.currentDataset);
    url.searchParams.set("hit", hitId);
    window.history.replaceState({}, "", url.toString());

    const cacheKey = `${state.currentDataset}:${hitId}`;
    let detail = state.detailCache.get(cacheKey);
    if (!detail) {
      if (showLoader) els.canvas.innerHTML = `<div class="loading-state"><span class="pulse-ring"></span> Resolving ${esc(hitId)}…</div>`;
      if (state.staticMode) {
        const hitMeta = state.summary && state.summary.hits && state.summary.hits.find(h => h.hit_id === hitId);
        const chunkRel = hitMeta && hitMeta.chunk;
        if (!chunkRel) throw new Error(`Missing static chunk for ${hitId}`);
        const chunkUrl = `./static_data/${encodeURIComponent(state.currentDataset)}/${chunkRel}`;
        if (!state.chunkPromises.has(chunkUrl)) {
          state.chunkPromises.set(chunkUrl, fetch(chunkUrl).then(r => r.json()));
        }
        const chunkMap = await state.chunkPromises.get(chunkUrl);
        Object.entries(chunkMap || {}).forEach(([hid, d]) => {
          state.detailCache.set(`${state.currentDataset}:${hid}`, d);
        });
        detail = state.detailCache.get(cacheKey);
      } else {
        const resp = await fetch(`/api/datasets/${encodeURIComponent(state.currentDataset)}/hit/${encodeURIComponent(hitId)}`);
        detail = await resp.json();
        state.detailCache.set(cacheKey, detail);
      }
    }
    if (detail) renderCanvas(detail);
  }

  function linkifyReason(text, recordsById) {
    const re = /\b((?:CUS|KYC|NOTE|SR|ACC|APP|H|A)-[0-9A-Za-z]+)\b/g;
    let out = "", last = 0, m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      const id = m[1];
      out += (recordsById && recordsById[id])
        ? `<button class="ev-inline" data-inspect="${esc(id)}">${esc(id)}</button>`
        : esc(id);
      last = m.index + id.length;
    }
    return out + esc(text.slice(last));
  }

  function renderPrecedenceTrack(detail, cand) {
    const out = detail.output;
    const ev = (cand && cand.evaluation) || {};
    const applicable = new Set(ev.all_applicable_codes || []);
    const firedCode = out.reason_code;
    const dCls = decCls(out.decision);

    const steps = [
      { n: "01", key: "ENTITY_TYPE_MISMATCH", label: "TYPE" },
      { n: "02", key: "DECEASED", label: "DECEASED" },
      { n: "03", key: "TEMPORAL_IMPOSSIBILITY", label: "TEMPORAL" },
      { n: "04", key: "DOB_MISMATCH", label: "DOB CHECK" },
      { n: "05", key: "NAME_MISMATCH_VERIFIED", label: "VERIFIED NAME" },
      { n: "06", key: "LOCATION_MISMATCH", label: "GEOGRAPHY" },
      { n: "07", key: "FINAL", label: out.decision === "SAME_ENTITY" ? "CONFIRM" : "REVIEW" },
    ];

    let foundFired = false;
    return `<div class="precedence-track">${steps.map(st => {
      const isFinalMatch = st.key === "FINAL" && (out.decision === "SAME_ENTITY" || out.decision === "REVIEW");
      const isFired = st.key === firedCode || isFinalMatch;
      let stateTxt = "PASS";
      if (isFired) {
        foundFired = true;
        stateTxt = out.decision === "REVIEW" ? "HELD" : "FIRED";
      } else if (foundFired) {
        stateTxt = applicable.has(st.key) ? "ALSO TRUE" : "SKIPPED";
      }
      return `
        <div class="p-step ${isFired ? `fired ${dCls}` : ""}">
          <div class="p-num"><span>${st.n}</span><span>${isFired ? "●" : "○"}</span></div>
          <div class="p-name">${esc(st.label)}</div>
          <div class="p-state">${stateTxt}</div>
        </div>
      `;
    }).join("")}</div>`;
  }

  function renderProvenanceStreamSVG(detail, cand) {
    const out = detail.output;
    const alert = detail.alert;
    const hitProf = detail.hit_profile;
    const trail = (cand && cand.raw_trail) || {};
    const searchRows = (detail.search_shield_trace && detail.search_shield_trace.candidates) || [];
    const evSet = new Set(out.evidence || []);
    const verdictColor = out.decision === "DIFFERENT_ENTITY" ? "#10b981" : (out.decision === "SAME_ENTITY" ? "#f43f5e" : "#f59e0b");

    // Build Left Nodes (Customer Stream)
    const left = [];
    left.push({
      id: cand && !cand.is_unresolved ? (cand.canonical_record_id || cand.record_ids[0]) : alert.alert_id,
      kicker: detail.resolved_alert.resolution_status,
      title: cand && !cand.is_unresolved ? (cand.canonical_record_id || "Cluster") : "Unresolved",
      sub: cand ? `${cand.effective_name || "?"}${cand.record_ids.length > 1 ? ` (+${cand.record_ids.length - 1} merged)` : ""}` : "No CRM fit",
      color: "#60a5fa",
      active: true,
      dashed: Boolean(cand && cand.is_unresolved),
    });

    (trail.kyc_checks || []).slice(0, 2).forEach(k => {
      const ok = k._tier_status === "TIER_1_APPROVED";
      left.push({
        id: k.check_id,
        kicker: ok ? "TIER 1 VERIFIED" : "TIER 0 EXCLUDED",
        title: k.check_id,
        sub: ok ? (k.verified_dob || k.verified_name || k.document_country || "Approved") : `${k.result || "Excluded"} (ignored)`,
        color: ok ? "#10b981" : "#475569",
        active: ok && evSet.has(k.check_id),
        dashed: !ok,
      });
    });

    (trail.notes || []).slice(0, 2).forEach(n => {
      const excl = n._tier_status === "TIER_0_EXCLUDED";
      left.push({
        id: n.note_id,
        kicker: excl ? "TIER 0 EXCLUDED" : `NOTE · ${(n.channel || "text").toUpperCase()}`,
        title: n.note_id,
        sub: (n.text || "").slice(0, 32) + ((n.text || "").length > 32 ? "…" : ""),
        color: excl ? "#475569" : "#22d3ee",
        active: !excl && evSet.has(n.note_id),
        dashed: excl,
      });
    });

    if ((trail.quarantined_customers || []).length > 0) {
      const q = trail.quarantined_customers[0];
      left.push({
        id: q.record_id,
        kicker: "QUARANTINED · DIFF DOB",
        title: q.record_id,
        sub: `${q.full_name || "Family"} (${q.dob || "?"})`,
        color: "#f59e0b",
        active: false,
        dashed: true,
      });
    }

    // Build Right Nodes (Watchlist & Anti-Namesake Shield)
    const right = [];
    right.push({
      id: hitProf.hit_id,
      kicker: `WATCHLIST · ${hitProf.entity_type.toUpperCase()}`,
      title: hitProf.hit_id,
      sub: `${hitProf.primary_name} · ${hitProf.countries.map(c => c.iso).join(",") || "No Geo"}`,
      color: "#818cf8",
      active: true,
      dashed: false,
    });

    const sortedSr = [...searchRows].sort((a, b) => {
      const rank = s => s === "USED_FOR_DOB" ? 0 : (s === "ANCHORED_NO_DOB" ? 1 : (s === "BLOCKED" ? 2 : 3));
      return rank(a.status) - rank(b.status);
    });
    const anchoredSr = sortedSr.filter(r => r.status === "USED_FOR_DOB" || r.status === "ANCHORED_NO_DOB");
    const blockedSr = sortedSr.filter(r => r.status === "BLOCKED");

    anchoredSr.slice(0, 2).forEach(r => {
      right.push({
        id: r.result_id,
        kicker: "SHIELD · ANCHORED",
        title: r.result_id,
        sub: (hitProf.dob_detail || r.title || "").slice(0, 32),
        color: "#10b981",
        active: true,
        dashed: false,
      });
    });

    if (blockedSr.length > 0) {
      const br = blockedSr[0].block_reason || "Namesake rejected";
      right.push({
        id: blockedSr[0].result_id,
        kicker: `SHIELD · ${blockedSr.length} DECOY${blockedSr.length > 1 ? "S" : ""} BLOCKED`,
        title: blockedSr.length === 1 ? blockedSr[0].result_id : `${blockedSr[0].result_id} +${blockedSr.length - 1}`,
        sub: br.length > 32 ? br.slice(0, 32) + "…" : br,
        color: "#f43f5e",
        active: false,
        dashed: true,
      });
    } else if (hitProf.earliest_report_date || hitProf.deceased_date) {
      right.push({
        id: hitProf.hit_id,
        kicker: hitProf.deceased_date ? "DECEASED DATE" : "DATED REPORT",
        title: hitProf.deceased_date || hitProf.earliest_report_date,
        sub: hitProf.deceased_date ? `Died before ${detail.screened_at}` : "Earliest 'According to' report",
        color: "#f43f5e",
        active: evSet.has(hitProf.hit_id) || out.reason_code === "TEMPORAL_IMPOSSIBILITY",
        dashed: false,
      });
    }

    const nodeH = 54, gap = 14, pad = 16;
    const maxRows = Math.max(left.length, right.length, 2);
    const svgH = Math.max(190, pad * 2 + maxRows * nodeH + (maxRows - 1) * gap);
    const midY = svgH / 2;

    const leftYs = left.map((_, i) => (svgH - (left.length * nodeH + (left.length - 1) * gap)) / 2 + i * (nodeH + gap));
    const rightYs = right.map((_, i) => (svgH - (right.length * nodeH + (right.length - 1) * gap)) / 2 + i * (nodeH + gap));

    let paths = "";
    let pulses = "";

    left.forEach((n, i) => {
      const y = leftYs[i] + nodeH / 2;
      const d = `M 284 ${y} C 350 ${y}, 355 ${midY}, 405 ${midY}`;
      const col = n.active ? verdictColor : (n.dashed ? n.color : "#334155");
      paths += `<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${n.active ? 0.85 : 0.28}" stroke-width="${n.active ? 1.8 : 1}" ${n.dashed ? 'stroke-dasharray="4 4"' : ""}/>`;
      if (n.active) {
        pulses += `<circle r="2.6" fill="${verdictColor}"><animateMotion dur="2.6s" repeatCount="indefinite" path="${d}"/></circle>`;
      }
    });

    right.forEach((n, i) => {
      const y = rightYs[i] + nodeH / 2;
      const d = `M 716 ${y} C 650 ${y}, 645 ${midY}, 595 ${midY}`;
      const col = n.active ? verdictColor : (n.dashed ? n.color : "#334155");
      paths += `<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${n.active ? 0.85 : 0.28}" stroke-width="${n.active ? 1.8 : 1}" ${n.dashed ? 'stroke-dasharray="4 4"' : ""}/>`;
      if (n.active) {
        pulses += `<circle r="2.6" fill="${verdictColor}"><animateMotion dur="2.6s" repeatCount="indefinite" path="${d}"/></circle>`;
      }
    });

    function nodeSvg(x, y, w, n) {
      const fill = n.active ? "rgba(15, 23, 42, 0.92)" : "rgba(7, 12, 26, 0.72)";
      return `
        <g class="s-node" data-inspect="${esc(n.id)}">
          <rect x="${x}" y="${y}" width="${w}" height="${nodeH}" rx="3" fill="${fill}" stroke="${n.color}" stroke-opacity="${n.active ? 0.85 : 0.4}" stroke-width="${n.active ? 1.4 : 1}" ${n.dashed ? 'stroke-dasharray="4 3"' : ""}/>
          <text x="${x + 12}" y="${y + 16}" fill="${n.color}" font-size="8.8" font-weight="600" letter-spacing="0.8" font-family="ui-monospace, monospace">${esc(n.kicker)}</text>
          <text x="${x + 12}" y="${y + 32}" fill="#f8fafc" font-size="11.5" font-weight="600" font-family="ui-monospace, monospace">${esc(n.title)}</text>
          <text x="${x + 12}" y="${y + 46}" fill="#94a3b8" font-size="10">${esc(n.sub)}</text>
        </g>
      `;
    }

    const centerNode = `
      <g class="s-node" data-inspect="__OUTPUT__">
        <rect x="405" y="${midY - 38}" width="190" height="76" rx="4" fill="rgba(7, 12, 26, 0.96)" stroke="${verdictColor}" stroke-width="1.8"/>
        <text x="500" y="${midY - 17}" text-anchor="middle" fill="#64748b" font-size="8.8" font-weight="600" letter-spacing="1.2" font-family="ui-monospace, monospace">POLICY VERDICT</text>
        <text x="500" y="${midY + 4}" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace">${esc(out.decision)}</text>
        <text x="500" y="${midY + 23}" text-anchor="middle" fill="${verdictColor}" font-size="10" font-weight="600" font-family="ui-monospace, monospace">${esc(out.reason_code)}</text>
      </g>
    `;

    return `
      <svg class="stream-svg" viewBox="0 0 1000 ${svgH}" preserveAspectRatio="xMidYMid meet">
        ${paths}
        ${pulses}
        ${left.map((n, i) => nodeSvg(14, leftYs[i], 270, n)).join("")}
        ${centerNode}
        ${right.map((n, i) => nodeSvg(716, rightYs[i], 270, n)).join("")}
      </svg>
    `;
  }

  function highlightSnippet(text, phrase, countries) {
    let html = esc(text || "");
    if (phrase) {
      const reP = new RegExp(`(${phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
      html = html.replace(reP, '<span class="hl-phrase">$1</span>');
    }
    (countries || []).forEach(c => {
      if (c.name && c.name.length > 2) {
        const reC = new RegExp(`\\b(${c.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})\\b`, "gi");
        html = html.replace(reC, '<span class="hl-country">$1</span>');
      }
    });
    return html;
  }

  function renderCanvas(detail) {
    state.lastRenderedDetail = detail;
    els.canvas.classList.toggle("building-blank", Boolean(state.pendingStudioBuild));
    const out = detail.output;
    const resAlert = detail.resolved_alert;
    const hitProf = detail.hit_profile;
    const cands = resAlert.candidates || [];
    const cand = cands[state.selectedCandidateIdx] || cands[0];
    const ev = (cand && cand.evaluation) || {};
    const facts = ev.facts || {};
    const dCls = decCls(out.decision);

    const custDisplay = (cand && cand.effective_name) || (detail.alert.customer && detail.alert.customer.name) || "Unknown";
    const cidDisplay = out.customer_record_id === null ? "null" : out.customer_record_id;

    let lblStatus = "";
    if (detail.label) {
      lblStatus = detail.label_match === "MATCH"
        ? `<span class="mono" style="color:#34d399;font-size:11px;">✓ MATCHES LABEL</span>`
        : `<span class="mono" style="color:#fbbf24;font-size:11px;">LABEL: ${esc(detail.label.decision)}</span>`;
    }

    // Multi-candidate bar if AMBIGUOUS
    const candStripHtml = cands.length > 1 ? `
      <div class="cand-strip">
        ${cands.map((c, idx) => {
          const cev = c.evaluation || {};
          return `
            <button class="cand-tab ${idx === state.selectedCandidateIdx ? "active" : ""}" data-cidx="${idx}">
              <div class="mono" style="font-size:11px;font-weight:600;color:var(--ink);">
                <span class="dot ${decCls(cev.decision)}" style="margin-right:6px;"></span>${esc(c.canonical_record_id || c.cluster_id)}
              </div>
              <div class="mono" style="font-size:10px;color:var(--ink-3);margin-top:2px;">
                ${esc(c.effective_name || "?")} · ${esc(c.dob || "No DOB")} → ${esc(cev.reason_code || "—")}
              </div>
            </button>
          `;
        }).join("")}
      </div>
    ` : "";

    // Ledger comparisons
    const etOp = cand && cand.entity_type === hitProf.entity_type ? `<span style="color:var(--ink-3);">==</span>` : `<span style="color:var(--emerald);">≠</span>`;
    const nameOp = facts.short_individual_name
      ? `<span style="color:var(--amber);">?</span>`
      : (facts.name_agrees ? `<span style="color:var(--crimson);">≡</span>` : ((ev.all_applicable_codes || []).includes("NAME_MISMATCH_VERIFIED") ? `<span style="color:var(--emerald);">≠</span>` : `<span style="color:var(--ink-3);">?</span>`));
    const dobOp = facts.dob_status === "CONTRADICT"
      ? `<span style="color:var(--emerald);">≠</span>`
      : (facts.dob_status === "AGREE" ? `<span style="color:var(--crimson);">≡</span>` : `<span style="color:var(--ink-3);">?</span>`);
    const sharedSet = new Set(facts.shared_countries || []);
    const geoOp = sharedSet.size > 0
      ? `<span style="color:var(--crimson);">∩</span>`
      : (facts.countries_disjoint ? `<span style="color:var(--emerald);">≠</span>` : `<span style="color:var(--ink-3);">?</span>`);
    const tempOp = (ev.all_applicable_codes || []).some(c => c === "DECEASED" || c === "TEMPORAL_IMPOSSIBILITY")
      ? `<span style="color:var(--emerald);">≠</span>`
      : `<span style="color:var(--ink-3);">—</span>`;

    const wfStepNames = {
      dobs_field: "Step 1 · Structured hit.dobs[]",
      profile_notes: "Step 2 · First-para profile_notes",
      search_results: "Step 3 · Anchored search_results",
    };

    // Search Shield rows
    const st = detail.search_shield_trace || { candidates: [] };
    const shieldHtml = (st.candidates || []).length > 0 ? `
      <section class="section-block">
        <div class="section-head">
          <span class="kicker">ANTI-NAMESAKE SEARCH SHIELD · REQUIRED PHRASE: “${esc(st.listing_phrase)}”</span>
          <span class="mono" style="font-size:11px;color:var(--ink-3);">${st.candidates.length} CANDIDATES EVALUATED</span>
        </div>
        <div>
          ${st.candidates.map(r => {
            const ok = r.status === "USED_FOR_DOB" || r.status === "ANCHORED_NO_DOB";
            const statusCol = ok ? "#34d399" : (r.status === "BLOCKED" ? "#fb7185" : "#64748b");
            return `
              <div class="shield-row" data-inspect="${esc(r.result_id)}">
                <div class="mono" style="font-size:11.5px;font-weight:600;color:var(--ink);">${esc(r.result_id)}</div>
                <div>
                  <div style="font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:3px;">${esc(r.title || "")}</div>
                  <div style="font-size:12px;color:var(--ink-2);line-height:1.55;">${highlightSnippet(r.snippet, st.listing_phrase, r.found_countries)}</div>
                </div>
                <div style="text-align:right;">
                  <div class="mono" style="font-size:10.5px;font-weight:700;color:${statusCol};">${esc(r.status)}</div>
                  ${r.block_reason ? `<div style="font-size:10.5px;color:var(--ink-3);margin-top:3px;">${esc(r.block_reason)}</div>` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </section>
    ` : "";

    // Watchlist Profile Notes
    const pnRaw = detail.hit_raw && detail.hit_raw.profile_notes;
    const notesHtml = pnRaw ? `
      <section class="section-block">
        <div class="section-head">
          <span class="kicker">WATCHLIST PROFILE NOTES</span>
          <button class="ghost-btn" data-inspect="${esc(hitProf.hit_id)}">INSPECT RAW HIT →</button>
        </div>
        <div style="font-size:12.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;max-width:900px;">${
          esc(pnRaw).replace(/(According to [^\n:]+;\s*[^:\n]+:)/gi, '<span class="hl-date">$1</span>')
        }</div>
      </section>
    ` : "";

    // Trail Summary Grid
    const trail = (cand && cand.raw_trail) || {};
    const trailItems = [];
    (trail.customers || []).forEach(c => trailItems.push({ id: c.record_id, tag: c.record_id === cand.canonical_record_id ? "CRM · CANONICAL" : "CRM · MERGED", title: c.full_name, sub: `${c.dob || "No DOB"} · ${c.residence_country || "?"}`, excl: false }));
    (trail.quarantined_customers || []).forEach(q => trailItems.push({ id: q.record_id, tag: "QUARANTINED · FAMILY", title: q.full_name, sub: `Shared phone, DOB ${q.dob || "?"}`, excl: true }));
    (trail.kyc_checks || []).forEach(k => trailItems.push({ id: k.check_id, tag: k._tier_status === "TIER_1_APPROVED" ? "KYC · TIER 1 APPROVED" : "KYC · TIER 0 EXCLUDED", title: k.verified_name || k.check_id, sub: `${k.verified_dob || "No DOB"} · ${k.document_country || "?"}`, excl: k._tier_status !== "TIER_1_APPROVED" }));
    (trail.notes || []).forEach(n => trailItems.push({ id: n.note_id, tag: `NOTE · ${(n.channel || "note").toUpperCase()}`, title: (n.text || "").slice(0, 44) + "…", sub: n.created_at || "", excl: n._tier_status === "TIER_0_EXCLUDED" }));

    els.canvas.innerHTML = `
      <div class="canvas-inner">
        <!-- EDITORIAL HERO -->
        <section class="hero">
          <div class="hero-ambient ${dCls}"></div>
          <div class="hero-kicker-row">
            <div class="kicker">
              ${esc(out.hit_id)} &nbsp;/&nbsp; ALERT ${esc(out.alert_id)} &nbsp;/&nbsp; ${esc(resAlert.resolution_status)} &nbsp;/&nbsp; ${esc(hitProf.entity_type)} &nbsp;/&nbsp; SCREENED ${esc(detail.screened_at)}
            </div>
            <div class="hero-actions">
              ${lblStatus}
              <button class="ghost-btn" data-inspect="__OUTPUT__">OUTPUT JSONL ↗</button>
            </div>
          </div>

          <h1 class="hero-headline">
            <span>${esc(custDisplay)}</span>
            <span class="hero-op ${dCls}">${decOp(out.decision)}</span>
            <span class="hero-hit-name">${esc(hitProf.primary_name)}</span>
          </h1>

          <div class="verdict-row">
            <span class="verdict-label ${dCls}"><span class="dot ${dCls}"></span>${esc(out.decision)}</span>
            <span class="code-tag">${esc(out.reason_code)}</span>
            <span class="meta-tag">CUSTOMER_ID: <strong style="color:var(--ink-2);">${esc(cidDisplay)}</strong></span>
          </div>

          <p class="narrative-prose">${linkifyReason(out.reason || "", detail.records_by_id)}</p>

          <div class="evidence-strip">
            <span class="kicker">DECIDING EVIDENCE</span>
            ${(out.evidence || []).map(id => `<button class="ev-link" data-inspect="${esc(id)}">${esc(id)}</button>`).join("")}
          </div>
        </section>

        <!-- HORIZONTAL POLICY PRECEDENCE PIPELINE -->
        <section class="section-block">
          <div class="section-head">
            <span class="kicker">POLICY PRECEDENCE EVALUATION PIPELINE</span>
            <span class="mono" style="font-size:10.5px;color:var(--ink-3);">CLEARANCE 60:3 · CONFIRMATION 2:2</span>
          </div>
          ${renderPrecedenceTrack(detail, cand)}
          ${candStripHtml}
        </section>

        <!-- FULL-BLEED ANIMATED NEURAL PROVENANCE STREAM -->
        <section class="section-block">
          <div class="section-head">
            <span class="kicker">NEURO-SYMBOLIC PROVENANCE STREAM</span>
            <span class="mono" style="font-size:10.5px;color:var(--ink-3);">CLICK ANY NODE TO INSPECT SOURCE</span>
          </div>
          <div class="stream-stage">${renderProvenanceStreamSVG(detail, cand)}</div>
        </section>

        <!-- OPEN-CANVAS HAIRLINE T-ACCOUNT LEDGER -->
        <section class="section-block">
          <div class="section-head">
            <span class="kicker">ENTITY COMPARISON LEDGER</span>
            <span class="mono" style="font-size:10.5px;color:var(--ink-3);">TIER 1 VERIFIED &gt; TIER 2 DECLARED &gt; TIER 3 CONTEXTUAL</span>
          </div>
          <table class="ledger">
            <thead>
              <tr>
                <th>Dimension</th>
                <th>Customer Side (Reconstructed)</th>
                <th style="text-align:center;">Op</th>
                <th>Watchlist Subject (Resolved)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="ledger-dim">Entity Type</td>
                <td>${esc(cand ? cand.entity_type : "—")}</td>
                <td class="ledger-op">${etOp}</td>
                <td>${esc(hitProf.entity_type)}</td>
              </tr>
              <tr>
                <td class="ledger-dim">Identity</td>
                <td>
                  ${cand && cand.verified_name ? `<div><span class="tier-tag">T1 VERIFIED</span><strong>${esc(cand.verified_name)}</strong> <button class="ev-inline" data-inspect="${esc(cand.verified_name_source_id)}">${esc(cand.verified_name_source_id)}</button></div>` : ""}
                  ${(cand && cand.declared_names || []).map(d => `<div class="sub-line">Declared: ${esc(d.name)} <button class="ev-inline" data-inspect="${esc(d.source_id)}">${esc(d.source_id)}</button></div>`).join("")}
                </td>
                <td class="ledger-op">${nameOp}</td>
                <td>
                  <div><strong>${esc(hitProf.primary_name)}</strong></div>
                  ${hitProf.all_names.length > 1 ? `<div class="sub-line">Aliases: ${esc(hitProf.all_names.slice(1).join(" · "))}</div>` : ""}
                </td>
              </tr>
              <tr>
                <td class="ledger-dim">Birth / Inc.</td>
                <td>
                  ${cand && cand.dob
                    ? `<span class="tier-tag">${cand.dob_is_verified ? "T1 VERIFIED" : "T2 DECLARED"}</span><strong class="mono">${esc(cand.dob)}</strong> <button class="ev-inline" data-inspect="${esc(cand.dob_source_id)}">${esc(cand.dob_source_id)}</button>`
                    : `<span style="color:var(--ink-4);">Not settled</span>`}
                </td>
                <td class="ledger-op">${dobOp}</td>
                <td>
                  ${hitProf.dobs && hitProf.dobs.length
                    ? `<div class="mono"><strong>${esc(hitProf.dobs.join(", "))}</strong></div><div class="sub-line">${esc(wfStepNames[hitProf.dob_source] || hitProf.dob_source)}${hitProf.dob_detail ? ` · ${esc(hitProf.dob_detail)}` : ""}</div>`
                    : `<span style="color:var(--ink-4);">None across 3-step waterfall</span>`}
                </td>
              </tr>
              <tr>
                <td class="ledger-dim">Geography</td>
                <td>
                  ${(cand && cand.countries || []).length
                    ? cand.countries.map(c => `<span style="margin-right:10px;${sharedSet.has(c.iso) ? "color:#fb7185;font-weight:600;" : ""}">${esc(c.name)} <span class="mono" style="color:var(--ink-3);">(${esc(c.iso)})</span></span>`).join("")
                    : `<span style="color:var(--ink-4);">None settled</span>`}
                </td>
                <td class="ledger-op">${geoOp}</td>
                <td>
                  ${(hitProf.countries || []).length
                    ? hitProf.countries.map(c => `<span style="margin-right:10px;${sharedSet.has(c.iso) ? "color:#fb7185;font-weight:600;" : ""}">${esc(c.name)} <span class="mono" style="color:var(--ink-3);">(${esc(c.iso)})</span></span>`).join("")
                    : `<span style="color:var(--ink-4);">None listed</span>`}
                </td>
              </tr>
              <tr>
                <td class="ledger-dim">Temporal</td>
                <td>
                  <span class="mono">Screened ${esc(detail.screened_at)}</span>
                  ${facts.max_age_at_report !== null && facts.max_age_at_report !== undefined ? `<div class="sub-line">Max age at earliest report: <strong>${facts.max_age_at_report}</strong> (policy floor 16)</div>` : ""}
                </td>
                <td class="ledger-op">${tempOp}</td>
                <td>
                  ${hitProf.deceased_date ? `<div class="mono">Deceased: <strong>${esc(hitProf.deceased_date)}</strong></div>` : (hitProf.life_status ? `<div class="sub-line">Life status: ${esc(hitProf.life_status)} (no deceased_date)</div>` : "")}
                  ${hitProf.earliest_report_date ? `<div class="mono">Earliest dated report: <strong>${esc(hitProf.earliest_report_date)}</strong></div>` : (!hitProf.deceased_date && !hitProf.life_status ? `<span style="color:var(--ink-4);">No dated report or death date</span>` : "")}
                </td>
              </tr>
            </tbody>
          </table>
        </section>

        ${shieldHtml}
        ${notesHtml}

        <!-- CUSTOMER SOURCE TRAIL -->
        ${trailItems.length ? `
          <section class="section-block" style="border-bottom:none;">
            <div class="section-head">
              <span class="kicker">RESOLVED CUSTOMER RECORD TRAIL (${trailItems.length})</span>
              <span class="mono" style="font-size:10.5px;color:var(--ink-3);">CLICK TO INSPECT</span>
            </div>
            <div class="trail-list">
              ${trailItems.map(it => `
                <div class="trail-cell ${it.excl ? "excluded" : ""}" data-inspect="${esc(it.id)}">
                  <div class="kicker" style="color:${it.excl ? "#f59e0b" : "var(--cobalt-bright)"};">${esc(it.tag)}</div>
                  <div class="mono" style="font-size:12px;font-weight:600;color:var(--ink);margin-top:4px;">${esc(it.id)}</div>
                  <div style="font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(it.title || "")}</div>
                  <div class="sub-line">${esc(it.sub)}</div>
                </div>
              `).join("")}
            </div>
          </section>
        ` : ""}
      </div>
    `;

    // Bind canvas click handlers
    els.canvas.querySelectorAll("[data-inspect]").forEach(el => {
      el.addEventListener("click", () => openSheet(detail, el.getAttribute("data-inspect")));
    });
    els.canvas.querySelectorAll("[data-cidx]").forEach(el => {
      el.addEventListener("click", () => {
        state.selectedCandidateIdx = parseInt(el.getAttribute("data-cidx"), 10) || 0;
        renderCanvas(detail);
      });
    });
  }

  function openSheet(detail, recordId) {
    if (recordId === "__OUTPUT__") {
      state.sheetPayload = detail.output;
      els.sheetKicker.textContent = "EMITTED JSONL RECORD";
      els.sheetTitle.textContent = `${detail.output.hit_id} · ${detail.output.decision}`;
      const lblBlock = detail.label
        ? `<div class="kicker" style="margin:18px 0 8px;">GROUND-TRUTH / PRACTICE LABEL</div><pre class="code-block">${esc(JSON.stringify(detail.label, null, 2))}</pre>`
        : "";
      els.sheetBody.innerHTML = `<pre class="code-block">${esc(JSON.stringify(detail.output, null, 2))}</pre>${lblBlock}`;
    } else {
      const rec = detail.records_by_id && detail.records_by_id[recordId];
      if (!rec) return;
      state.sheetPayload = rec.data;
      els.sheetKicker.textContent = rec.kind.toUpperCase();
      els.sheetTitle.textContent = rec.id;
      const entries = Object.entries(rec.data || {}).filter(([k]) => k !== "_tier_status");
      const kv = entries.map(([k, v]) => `
        <div class="sheet-k">${esc(k)}</div>
        <div class="sheet-v">${v === null || v === undefined ? '<span style="color:var(--ink-4);">null</span>' : esc(typeof v === "object" ? JSON.stringify(v) : String(v))}</div>
      `).join("");
      els.sheetBody.innerHTML = `
        <div class="sheet-kv">${kv}</div>
        <div class="kicker" style="margin:16px 0 8px;">RAW JSON</div>
        <pre class="code-block">${esc(JSON.stringify(rec.data, null, 2))}</pre>
      `;
    }
    els.sheetBackdrop.classList.add("open");
    els.forensicSheet.classList.add("open");
  }

  function closeSheet() {
    els.sheetBackdrop.classList.remove("open");
    els.forensicSheet.classList.remove("open");
  }

  // ⌘K Command Palette
  function openCmdk() {
    els.cmdkOverlay.classList.add("open");
    els.cmdkInput.value = "";
    renderCmdkResults("");
    els.cmdkInput.focus();
  }
  function closeCmdk() {
    els.cmdkOverlay.classList.remove("open");
  }
  function renderCmdkResults(query) {
    const q = query.trim().toLowerCase();
    const actions = [];
    state.datasets.forEach(d => {
      if (!q || d.name.toLowerCase().includes(q) || d.id.includes(q)) {
        actions.push({ kind: "DATASET", title: `Switch to ${d.name}`, sub: d.id, run: () => { els.datasetSelect.value = d.id; loadDataset(d.id); } });
      }
    });
    ["DIFFERENT_ENTITY", "SAME_ENTITY", "REVIEW", "AMBIGUOUS"].forEach(tag => {
      if (!q || tag.toLowerCase().includes(q)) {
        actions.push({
          kind: "FILTER",
          title: `Filter: ${tag}`,
          sub: tag === "AMBIGUOUS" ? "Resolution status" : "Decision",
          run: () => {
            if (tag === "AMBIGUOUS") { state.filters.resStatus = "AMBIGUOUS"; els.resStatusFilter.value = "AMBIGUOUS"; }
            else { state.filters.decision = tag; renderTopTelemetry(); }
            applyFilters();
          }
        });
      }
    });
    if (state.summary) {
      const matches = state.summary.hits.filter(h =>
        !q || [h.hit_id, h.customer_name, h.hit_name, h.reason_code, h.customer_record_id || ""].join(" ").toLowerCase().includes(q)
      ).slice(0, 10);
      matches.forEach(h => {
        actions.push({
          kind: h.hit_id,
          title: `${h.customer_name} ${decOp(h.decision)} ${h.hit_name}`,
          sub: h.reason_code,
          run: () => selectHit(h.hit_id),
        });
      });
    }
    els.cmdkResults.innerHTML = actions.map((a, idx) => `
      <div class="cmdk-item" data-aidx="${idx}">
        <div>
          <span class="mono" style="font-size:11px;color:var(--cobalt-bright);margin-right:10px;">${esc(a.kind)}</span>
          <span style="font-size:12.5px;color:var(--ink);">${esc(a.title)}</span>
        </div>
        <span class="mono" style="font-size:10.5px;color:var(--ink-3);">${esc(a.sub)}</span>
      </div>
    `).join("");
    els.cmdkResults.querySelectorAll(".cmdk-item").forEach(item => {
      item.addEventListener("click", () => {
        const a = actions[parseInt(item.getAttribute("data-aidx"), 10)];
        closeCmdk();
        if (a) a.run();
      });
    });
  }

  // Event Wiring
  els.datasetSelect.addEventListener("change", e => loadDataset(e.target.value));
  els.searchInput.addEventListener("input", e => { state.filters.search = e.target.value; applyFilters(); });
  els.reasonFilter.addEventListener("change", e => { state.filters.reasonCode = e.target.value; applyFilters(); });
  els.resStatusFilter.addEventListener("change", e => { state.filters.resStatus = e.target.value; applyFilters(); });
  els.labeledOnlyChk.addEventListener("change", e => { state.filters.labeledOnly = e.target.checked; applyFilters(); });
  els.resetBtn.addEventListener("click", () => {
    state.filters = { decision: "ALL", reasonCode: "ALL", resStatus: "ALL", labeledOnly: false, search: "" };
    els.searchInput.value = ""; els.reasonFilter.value = "ALL"; els.resStatusFilter.value = "ALL"; els.labeledOnlyChk.checked = false;
    renderTopTelemetry(); applyFilters();
  });

  els.sheetBackdrop.addEventListener("click", closeSheet);
  els.sheetCloseBtn.addEventListener("click", closeSheet);
  els.sheetCopyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(state.sheetPayload, null, 2));
      els.sheetCopyBtn.textContent = "COPIED ✓";
      setTimeout(() => { els.sheetCopyBtn.textContent = "COPY JSON"; }, 1200);
    } catch (_) {}
  });

  els.openCmdkBtn.addEventListener("click", openCmdk);
  els.replaySwarmBtn.addEventListener("click", async () => {
    if (state.currentDataset && state.summary) {
      state.pendingStudioBuild = true;
      renderRail();
      if (state.lastRenderedDetail) renderCanvas(state.lastRenderedDetail);
      await runSwarmSequence(state.currentDataset, Promise.resolve(state.summary), true);
      if (state.pendingStudioBuild && state.lastRenderedDetail) {
        await sleepMs(140);
        if (state.pendingStudioBuild) await runStudioCursorBuild(state.lastRenderedDetail);
      }
    }
  });
  els.swarmSkipBtn.addEventListener("click", () => closeSwarmStage(false, true));
  els.toggleFlockBtn.addEventListener("click", () => {
    state.flockEnabled = !state.flockEnabled;
    if (state.flockEnabled) wakeFlockAroundPointer();
    updateFlockVisibility();
  });
  els.replayBuildBtn.addEventListener("click", () => {
    if (state.lastRenderedDetail) {
      state.pendingStudioBuild = true;
      renderRail();
      renderCanvas(state.lastRenderedDetail);
      runStudioCursorBuild(state.lastRenderedDetail);
    }
  });
  const onPointerActivity = e => {
    flockState.mouse.x = e.clientX;
    flockState.mouse.y = e.clientY;
    flockState.mouse.active = true;
    flockState.mouse.lastMove = performance.now();
  };
  window.addEventListener("pointermove", onPointerActivity, { passive: true });
  window.addEventListener("pointerdown", onPointerActivity, { passive: true });
  document.documentElement.addEventListener("pointerleave", () => {
    flockState.mouse.active = false;
  });
  els.cmdkOverlay.addEventListener("click", e => { if (e.target === els.cmdkOverlay) closeCmdk(); });
  els.cmdkInput.addEventListener("input", e => renderCmdkResults(e.target.value));

  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      els.cmdkOverlay.classList.contains("open") ? closeCmdk() : openCmdk();
      return;
    }
    if (e.key === "Escape") {
      if (els.swarmStage.classList.contains("active")) { closeSwarmStage(false, true); return; }
      if (flockState.building) {
        state.studioBuildToken += 1;
        flockState.building = false;
        restoreStudioStatic();
        updateFlockVisibility();
        return;
      }
      closeCmdk(); closeSheet(); return;
    }
    if (e.key === "/" && document.activeElement !== els.searchInput && !els.cmdkOverlay.classList.contains("open")) {
      e.preventDefault(); els.searchInput.focus(); return;
    }
    if (document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (!state.filteredHits.length) return;
    const idx = state.filteredHits.findIndex(h => h.hit_id === state.selectedHitId);
    if (e.key === "ArrowDown" || e.key === "j") {
      e.preventDefault();
      const next = state.filteredHits[Math.min(state.filteredHits.length - 1, idx + 1)];
      if (next) selectHit(next.hit_id);
    } else if (e.key === "ArrowUp" || e.key === "k") {
      e.preventDefault();
      const prev = state.filteredHits[Math.max(0, idx - 1)];
      if (prev) selectHit(prev.hit_id);
    }
  });

  init();
})();
</script>
</body>
</html>
